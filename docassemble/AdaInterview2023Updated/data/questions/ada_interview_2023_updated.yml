features:
  hide standard menu: True
---
id: interview order
mandatory: True
code: |
  request_intro
  request_scope
  if request_scope == "other":
    other_request
  court_department
  person_name
  person_role
  hearing_is_scheduled
  if hearing_is_scheduled:
    hearing_date
  needs_listed_accommodation
  if needs_listed_accommodation:
    accommodations
  if not needs_listed_accommodation or accommodations["another"]:
    other_accommodations
  disability_summary
  requesting_for_self
  if not requesting_for_self:
    helper_name
  request_bbo
  answers_reviewed
  download_request
---
id: introduction
question: Ask a Massachusetts Trial Court for an ADA accommodation
subquestion: |
  This interview helps you fill out form **TC0035**. It makes a PDF for you to sign and give to the court in person or by mail.

  The court keeps the information on TC0035 confidential unless you waive confidentiality in writing or the law requires disclosure. Include only the information the court needs. Do not send medical records.

  Start as early as you can. The court suggests asking at least 10 business days before you need an accommodation when possible. You can still ask on shorter notice.

  [Read the court's ADA instructions](https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act)
continue button field: request_intro
---
id: choose the right request
question: Do you need this request form for a Massachusetts Trial Court case?
subquestion: |
  This form can request a sign language interpreter or an assistive listening device. It can also request court documents that work with a screen reader.

  You may need a motion to ask for more time to file or to attend by video. A motion can also ask for changes to how the hearing works. Jury service and the Appeals Court or Supreme Judicial Court have their own process.
field: request_scope
choices:
  - Yes, I need the Trial Court request form: request
  - I need a different form or I am not sure: other
---
id: other request
event: other_request
question: Find the right way to ask for an accommodation
subquestion: |
  If you are unsure, [contact the ADA Assistance Coordinator at your courthouse](https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act).

  * For jury service, see [jury duty accessibility](https://www.mass.gov/info-details/learn-about-jury-duty-accessibility).
  * For the Appeals Court, Supreme Judicial Court, or a Trial Court motion, see [the court's ADA forms](https://www.mass.gov/lists/americans-with-disabilities-act-ada-court-forms-instructions-and-information).
---
id: case information
question: Where is the case being heard?
subquestion: Copy this information from a court notice or other papers in the case.
fields:
  - Court department: court_department
    choices:
      - Boston Municipal Court: bmc
      - District Court: district
      - Housing Court: housing
      - Juvenile Court: juvenile
      - Land Court: land
      - Probate and Family Court: probate
      - Superior Court: superior
  - Court division or county: court_division
    maxlength: 55
  - Case name: case_name
    maxlength: 145
  - Case number (docket number), if known: docket_number
    required: False
    maxlength: 30
---
variable name: court_department_names
data:
  bmc: Boston Municipal Court
  district: District Court
  housing: Housing Court
  juvenile: Juvenile Court
  land: Land Court
  probate: Probate and Family Court
  superior: Superior Court
---
id: person contact information
question: Who needs the accommodation?
fields:
  - Full name: person_name
    maxlength: 85
  - Street address and apartment number: person_street
    required: False
    maxlength: 100
  - City, state, and ZIP code: person_city_state_zip
    required: False
    maxlength: 82
  - Phone number: person_phone
    required: False
    maxlength: 35
  - Email address: person_email
    datatype: email
    required: False
    maxlength: 90
validation code: |
  if not person_phone and not person_email:
    validation_error("Enter a phone number or email address so the court can contact the person.", field="person_phone")
---
id: person role
question: How is ${ person_name } involved in the case?
fields:
  - Role in the case: person_role
    datatype: radio
    choices:
      - A party to the case: party
      - An attorney or legal staff member: legal_staff
      - A witness: witness
      - Another role: other
  - Describe the role: other_case_role
    show if:
      variable: person_role
      is: other
    maxlength: 52
---
id: hearing scheduled
question: Is there a hearing date?
fields:
  - Hearing date is known: hearing_is_scheduled
    datatype: yesnoradio
---
id: hearing date and time
question: When is the hearing?
fields:
  - Hearing date: hearing_date
    datatype: date
  - Hearing time, if known: hearing_time
    datatype: time
    required: False
---
id: listed accommodations
question: Does the person need any of these accommodations?
subquestion: |
  The form lists assistive listening devices, live captions, and court documents by email. It also lists sign language interpreters and use of a powered mobility device.

  You can also describe another accommodation.
fields:
  - Needs an accommodation from the list: needs_listed_accommodation
    datatype: yesnoradio
---
id: pick accommodations
question: What accommodations does the person need?
subquestion: Choose all that apply.
fields:
  - Requested accommodations: accommodations
    datatype: checkboxes
    none of the above: False
    choices:
      - Assistive listening device: listening
      - Live captions (CART): cart
      - Court documents by email for a screen reader: screen_reader
      - American Sign Language (ASL) interpreter: asl
      - Interpreter for another sign language: other_sign
      - Use of a powered mobility device other than the person's motorized wheelchair: mobility
      - Another accommodation: another
  - Sign language: other_sign_language
    show if: accommodations["other_sign"]
    maxlength: 45
  - Describe the powered mobility device: mobility_description
    show if: accommodations["mobility"]
    maxlength: 85
validation code: |
  if not any(accommodations.values()):
    validation_error("Select at least one accommodation to continue.", field="accommodations")
---
id: another accommodation
question: What other accommodation does the person need?
subquestion: |
  Describe the specific help the person is asking for. For a change to the hearing or case rules, ask the court's ADA Assistance Coordinator which form to use.
fields:
  - Other accommodation: other_accommodations
    datatype: area
    rows: 4
    maxlength: 420
---
id: disability and accommodation
question: Why does the person need the accommodation?
subquestion: |
  Briefly explain how the disability affects the person's ability to take part in court. Include only what the court needs to understand the request. Do not include medical records.
fields:
  - Brief explanation: disability_summary
    datatype: area
    rows: 4
    maxlength: 420
---
id: who is making the request
question: Is ${ person_name } making and signing this request?
subquestion: Choose “Yes” if you are only helping the person type their answers and they will sign the form.
fields:
  - The person needing the accommodation will sign: requesting_for_self
    datatype: yesnoradio
---
id: requestor details
question: Who will sign the request for ${ person_name }?
fields:
  - Full name: helper_name
    maxlength: 80
  - Relationship to the person: helper_relationship
    maxlength: 65
  - Mailing address: helper_address
    maxlength: 100
    required: False
  - Phone number: helper_phone
    maxlength: 35
    required: False
  - Email address: helper_email
    datatype: email
    maxlength: 80
    required: False
validation code: |
  if not helper_phone and not helper_email:
    validation_error("Enter a phone number or email address for the person signing.", field="helper_phone")
---
id: attorney number
question: What is the signer’s Massachusetts attorney number?
subquestion: This is the Board of Bar Overseers (BBO) number. Leave this blank if it does not apply.
fields:
  - BBO number: request_bbo
    required: False
    maxlength: 12
---
id: check answers
question: Check your answers
subquestion: Check the case details, contact information, and what the court will read before you download your request.
continue button field: answers_reviewed
continue button label: Get my form
review:
  - Edit: court_department
    button: |
      **Court:** ${ court_department_names[court_department] }, ${ court_division }

      **Case:** ${ case_name } ${ docket_number }
  - Edit: person_name
    button: |
      **Person needing the accommodation:** ${ person_name }

      **Contact:** ${ person_street } ${ person_city_state_zip } ${ person_phone } ${ person_email }
  - Edit: person_role
    button: Review the person's role in the case
  - Edit: hearing_is_scheduled
    button: |
      **Hearing:** ${ format_date(hearing_date) if hearing_is_scheduled else "No date yet" } ${ format_time(hearing_time) if hearing_is_scheduled and hearing_time else "" }
  - Edit: needs_listed_accommodation
    button: Review the accommodations requested
  - Edit: accommodations
    show if: needs_listed_accommodation
    button: Edit the selected accommodations
  - Edit: other_accommodations
    show if: not needs_listed_accommodation or accommodations["another"]
    button: |
      **Other accommodation:** ${ other_accommodations }
  - Edit: disability_summary
    button: |
      **Explanation:** ${ disability_summary }
  - Edit: requesting_for_self
    button: |
      **Will sign:** ${ person_name if requesting_for_self else helper_name }
  - Edit: helper_name
    show if: not requesting_for_self
    button: |
      **Person signing:** ${ helper_name }, ${ helper_relationship }

      **Contact:** ${ helper_address } ${ helper_phone } ${ helper_email }
  - Edit: request_bbo
    button: |
      **BBO number:** ${ request_bbo or "None entered" }
---
id: split disability description across the two pages
depends on: disability_summary
code: |
  if len(disability_summary) <= 140:
    disability_first_page = disability_summary
    disability_second_page = ""
  else:
    split_at = disability_summary.rfind(" ", 0, 141)
    if split_at < 1:
      split_at = 140
    disability_first_page = disability_summary[:split_at].rstrip()
    disability_second_page = disability_summary[split_at:].lstrip()
---
id: download request
event: download_request
question: Download your ADA accommodation request
subquestion: |
  [Download your request form (PDF)](${ tc0035_attachment.pdf.url_for(attachment=True) })

  1. Review the PDF. Sign and date the request on page 2. You can print it and sign by hand. You can also sign in a PDF editor. In the signature field, type **/s/** followed by your name.
  2. Bring or mail it to the court department and division where the case is being heard, for the ADA Assistance Coordinator. Do not use e-filing.
  3. Keep a copy. If your court date is close or you need help, [contact the ADA Assistance Coordinator](https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act).

  Your request has not been sent to the court. Do not attach medical records.
---
attachment:
  name: Massachusetts Trial Court ADA accommodation request
  filename: massachusetts-ada-accommodation-request-tc0035
  variable name: tc0035_attachment
  valid formats:
    - pdf
  pdf template file: tc0035_request_for_accommodation.pdf
  editable: True
  pdftk: False
  fields:
    - court_department: ${ court_department_names[court_department] }
    - court_division: ${ court_division }
    - docket_number: ${ docket_number }
    - case_name: ${ case_name }
    - person_name: ${ person_name }
    - person_street: ${ person_street }
    - person_city_state_zip: ${ person_city_state_zip }
    - person_phone: ${ person_phone }
    - person_email: ${ person_email }
    - role_party: ${ person_role == "party" }
    - role_legal_staff: ${ person_role == "legal_staff" }
    - role_witness: ${ person_role == "witness" }
    - role_other: ${ person_role == "other" }
    - other_case_role: ${ other_case_role if person_role == "other" else "" }
    - hearing_date_and_time: ${ format_date(hearing_date, format="M/d/yyyy") + (" " + format_time(hearing_time, format="h:mm a") if hearing_time else "") if hearing_is_scheduled else "" }
    - assistive_listening_device: ${ needs_listed_accommodation and accommodations["listening"] }
    - cart: ${ needs_listed_accommodation and accommodations["cart"] }
    - screen_reader_documents: ${ needs_listed_accommodation and accommodations["screen_reader"] }
    - asl_interpreter: ${ needs_listed_accommodation and accommodations["asl"] }
    - other_sign_language_interpreter: ${ needs_listed_accommodation and accommodations["other_sign"] }
    - other_sign_language: ${ other_sign_language if needs_listed_accommodation and accommodations["other_sign"] else "" }
    - powered_mobility_device: ${ needs_listed_accommodation and accommodations["mobility"] }
    - powered_mobility_description_checkbox: ${ needs_listed_accommodation and accommodations["mobility"] }
    - powered_mobility_description: ${ mobility_description if needs_listed_accommodation and accommodations["mobility"] else "" }
    - other_accommodations: ${ other_accommodations if not needs_listed_accommodation or accommodations["another"] else "" }
    - disability_summary: ${ disability_first_page }
    - disability_continuation: ${ disability_second_page }
    - requestor_name: ${ person_name if requesting_for_self else helper_name }
    - requestor_relationship: ${ "Self" if requesting_for_self else helper_relationship }
    - requestor_phone: ${ person_phone if requesting_for_self else helper_phone }
    - requestor_email: ${ person_email if requesting_for_self else helper_email }
    - requestor_address: ${ ", ".join(part for part in (person_street, person_city_state_zip) if part) if requesting_for_self else helper_address }
    - requestor_bbo: ${ request_bbo }
