---
metadata:
  title: Ask a Massachusetts Trial Court for an ADA accommodation
  short title: Court ADA accommodation request
  description: Fill out a request for an accommodation that helps you take part in a Massachusetts Trial Court case. Download the completed request to sign and give to the court.
  can_I_use_this_form: |
    Use this form for an accommodation such as a sign language interpreter, assistive listening device, or documents that work with a screen reader. Some requests, such as more time to file or permission to attend by video, require a motion. Ask your court's ADA Assistance Coordinator if you are unsure.
  before_you_start: |
    Find the court name, case name, and case number if you know it. Have your hearing date and time ready if there is one. You do not need to upload medical records.
  authors:
    - Jessica Vandervort
    - Suffolk LIT Lab
  jurisdiction: NAM-US-US+MA
  languages:
    - en
  maturity: production
  original_form: https://www.mass.gov/doc/massachusetts-trial-court-request-form-for-an-accommodation-under-the-americans-with-disabilities-act-tc0035/download
  original_form_published_on: 2026-09-29
