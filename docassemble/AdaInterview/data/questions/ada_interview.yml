metadata:
  title: Ask the court for a change in rules to let you participate if you have a disability
  short title: Ask the court for a change
  description: >-
    Ask a Massachusetts Trial Court for a change that helps someone with a disability take part in a case.
    The court calls this a reasonable accommodation. Fill out the form online, then sign it and give it to the court.
  can_I_use_this_form: |
    Use this form for yourself or someone you are helping. You can ask for help such as a sign language interpreter,
    equipment that helps you hear, or documents that work with a screen reader.
    Some changes, like more time to file or permission to go to court by video, may need a separate written request to the judge.
  before_you_start: |
    Have the court name, case name, and case number if you know it. Write down the date and time of any hearing.
    Leave out medical records.
  authors:
    - Jessica Vandervort
    - Suffolk LIT Lab
  jurisdiction: NAM-US-US+MA
  languages:
    - en
  maturity: production
  original_form: https://www.mass.gov/doc/massachusetts-trial-court-request-form-for-an-accommodation-under-the-americans-with-disabilities-act-tc0035/download
  original_form_published_on: 2026-09-29
  review_date: 2026-11-19
  form_titles:
    - Request Form for an Accommodation under the Americans with Disabilities Act
  form_numbers:
    - TC0035
  LIST_topics:
    - RI-03-02-02-00
    - RI-03-02-03-00
  tags:
    - RI-03-02-02-00
    - RI-03-02-03-00
  help_page_title: How to ask a Massachusetts court for help taking part
  help_page_url: https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act
  estimated_completion_minutes: 10
  fees:
    - Filing fee: 0
---
features:
  hide standard menu: True
---
variable name: AL_ORGANIZATION_TITLE
data: Suffolk LIT Lab
---
code: |
  interview_short_title = all_variables(special="metadata")["title"]
  al_form_type = "existing_case"
---
id: interview order
mandatory: True
code: |
  # People who already passed the former opening screen can continue their request.
  if not showifdef("request_intro"):
    al_intro_screen
  request_scope
  if request_scope == "other":
    other_request
  court_department
  person_name
  person_role
  hearing_is_scheduled
  if hearing_is_scheduled:
    hearing_date
  needs_listed_accommodation
  if needs_listed_accommodation:
    accommodations
  if not needs_listed_accommodation or accommodations["another"]:
    other_accommodations
  disability_summary
  requesting_for_self
  if not requesting_for_self:
    helper_name
  request_bbo
  answers_reviewed
  download_request
---
id: choose the right request
question: Is this the right form for your request?
subquestion: |
  Use this form in a Massachusetts Trial Court case. Here are some changes you can ask for:

  * A sign language interpreter
  * Equipment that helps you hear
  * Documents that work with a screen reader

  You may need to ask a judge for some changes. Examples include more time to file or going to court by video.
  You ask in writing. The court calls that a motion. Jury duty and appeals courts have their own process.

  Ask as early as you can. The court suggests asking at least 10 business days ahead when possible.
  You can still ask if you have less time.

  The court keeps this form private. The court can share it if you give written permission or the law requires it.
  Include only what the court needs. Leave out medical records.
field: request_scope
choices:
  - This form fits my request: request
  - I need a different form or I am unsure: other
---
id: other request
event: other_request
question: Find out how to ask the court for a change
subquestion: |
  If you are unsure which form to use, ask the person at your courthouse who helps with disability requests.
  The court calls them the [ADA Assistance Coordinator](https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act).

  * For jury service, see [help taking part in jury duty](https://www.mass.gov/info-details/learn-about-jury-duty-accessibility).
  * For the Appeals Court, Supreme Judicial Court, or a Trial Court motion, see [the court’s forms for disability requests](https://www.mass.gov/lists/americans-with-disabilities-act-ada-court-forms-instructions-and-information).
---
id: case information
question: Where is the case being heard?
subquestion: Copy this information from a court notice or other papers in the case.
fields:
  - Court department: court_department
    choices:
      - Boston Municipal Court: bmc
      - District Court: district
      - Housing Court: housing
      - Juvenile Court: juvenile
      - Land Court: land
      - Probate and Family Court: probate
      - Superior Court: superior
  - Court division or county: court_division
    maxlength: 55
  - Case name: case_name
    maxlength: 145
  - Case number (docket number), if known: docket_number
    required: False
    maxlength: 30
---
variable name: court_department_names
data:
  bmc: Boston Municipal Court
  district: District Court
  housing: Housing Court
  juvenile: Juvenile Court
  land: Land Court
  probate: Probate and Family Court
  superior: Superior Court
---
id: person contact information
question: Who needs the court to make a change?
subquestion: Give the court a phone number or email address where it can reach this person.
fields:
  - Full name: person_name
    maxlength: 85
  - Street address and apartment number: person_street
    required: False
    maxlength: 100
  - City, state, and ZIP code: person_city_state_zip
    required: False
    maxlength: 82
  - Phone number: person_phone
    required: False
    maxlength: 35
  - Email address: person_email
    datatype: email
    required: False
    maxlength: 90
validation code: |
  if not person_phone and not person_email:
    validation_error("Enter a phone number or email address so the court can contact the person.", field="person_phone")
---
id: person role
question: How is ${ person_name } involved in the case?
fields:
  - Role in the case: person_role
    datatype: radio
    choices:
      - A person who brought the case or is responding to it: party
      - A lawyer or legal staff member: legal_staff
      - A witness: witness
      - Another role: other
  - Describe the role: other_case_role
    show if:
      variable: person_role
      is: other
    maxlength: 52
---
id: hearing scheduled
question: Is there a hearing date?
fields:
  - Do you know the hearing date?: hearing_is_scheduled
    datatype: yesnoradio
---
id: hearing date and time
question: When is the hearing?
fields:
  - Hearing date: hearing_date
    datatype: date
  - Hearing time, if known: hearing_time
    datatype: time
    required: False
---
id: listed accommodations
question: Does the person need any of these changes?
subquestion: |
  * Equipment that helps them hear
  * Words on a screen as people speak
  * Court documents by email so a screen reader can read them
  * A sign language interpreter
  * Permission to use a powered device to get around

  If they need a different change, you can describe it on the next screen.
fields:
  - Do they need a change from this list?: needs_listed_accommodation
    datatype: yesnoradio
---
id: pick accommodations
question: What changes does the person need?
subquestion: Choose all that apply.
fields:
  - Changes to ask for: accommodations
    datatype: checkboxes
    required: False
    none of the above: False
    choices:
      - Equipment that helps the person hear: listening
      - Live captions (words on a screen as people speak): cart
      - Court documents by email for a screen reader: screen_reader
      - American Sign Language (ASL) interpreter: asl
      - Interpreter for another sign language: other_sign
      - Use a powered device to get around, other than the person’s motorized wheelchair: mobility
      - Another change: another
  - Sign language: other_sign_language
    show if: accommodations["other_sign"]
    maxlength: 45
  - Describe the device the person uses to get around: mobility_description
    show if: accommodations["mobility"]
    maxlength: 85
validation code: |
  if not any(accommodations.values()):
    validation_error("Choose at least one change to continue.", field="accommodations")
---
id: another accommodation
question: What other change does the person need?
subquestion: |
  Describe what would help the person take part in court.
  To change how a hearing or case works, ask the court’s ADA Assistance Coordinator which form to use.
fields:
  - Other change: other_accommodations
    datatype: area
    rows: 4
    maxlength: 420
---
id: disability and accommodation
question: How does the disability make it harder to take part in court?
subquestion: |
  Explain what is hard to do and how the change would help.
  Include only what the court needs to understand your request. Leave out medical records.
fields:
  - Brief explanation: disability_summary
    datatype: area
    rows: 4
    maxlength: 420
---
id: who is making the request
question: Will ${ person_name } sign this request?
subquestion: Choose “Yes” if you are only helping the person type their answers and they will sign the form.
fields:
  - The person who needs the change will sign: requesting_for_self
    datatype: yesnoradio
---
id: requestor details
question: Who will sign the request for ${ person_name }?
subquestion: Give the court a phone number or email address where it can reach the person signing.
fields:
  - Full name: helper_name
    maxlength: 80
  - Relationship to the person: helper_relationship
    maxlength: 65
  - Mailing address: helper_address
    maxlength: 100
    required: False
  - Phone number: helper_phone
    maxlength: 35
    required: False
  - Email address: helper_email
    datatype: email
    maxlength: 80
    required: False
validation code: |
  if not helper_phone and not helper_email:
    validation_error("Enter a phone number or email address for the person signing.", field="helper_phone")
---
id: attorney number
question: Is the person signing a Massachusetts lawyer?
subquestion: If so, enter their Board of Bar Overseers (BBO) number. Otherwise, leave this blank.
fields:
  - BBO number: request_bbo
    required: False
    maxlength: 12
---
id: check answers
question: Check your answers
subquestion: Check the case details, contact information, and what the court will read before you download your request.
continue button field: answers_reviewed
continue button label: Get my form
review:
  - Edit: court_department
    button: |
      **Court:** ${ court_department_names[court_department] }, ${ court_division }

      **Case:** ${ case_name } ${ docket_number }
  - Edit: person_name
    button: |
      **Person who needs the change:** ${ person_name }

      **Contact:** ${ person_street } ${ person_city_state_zip } ${ person_phone } ${ person_email }
  - Edit: person_role
    button: Review the person's role in the case
  - Edit: hearing_is_scheduled
    button: |
      **Hearing:** ${ format_date(hearing_date) if hearing_is_scheduled else "No date yet" } ${ format_time(hearing_time) if hearing_is_scheduled and hearing_time else "" }
  - Edit: needs_listed_accommodation
    button: Review the changes you are asking for
  - Edit: accommodations
    show if: needs_listed_accommodation
    button: Edit the changes you chose
  - Edit: other_accommodations
    show if: not needs_listed_accommodation or accommodations["another"]
    button: |
      **Other change:** ${ other_accommodations }
  - Edit: disability_summary
    button: |
      **Explanation:** ${ disability_summary }
  - Edit: requesting_for_self
    button: |
      **Will sign:** ${ person_name if requesting_for_self else helper_name }
  - Edit: helper_name
    show if: not requesting_for_self
    button: |
      **Person signing:** ${ helper_name }, ${ helper_relationship }

      **Contact:** ${ helper_address } ${ helper_phone } ${ helper_email }
  - Edit: request_bbo
    button: |
      **BBO number:** ${ request_bbo or "None entered" }
---
id: split disability description across the two pages
depends on: disability_summary
code: |
  if len(disability_summary) <= 140:
    disability_first_page = disability_summary
    disability_second_page = ""
  else:
    split_at = disability_summary.rfind(" ", 0, 141)
    if split_at < 1:
      split_at = 140
    disability_first_page = disability_summary[:split_at].rstrip()
    disability_second_page = disability_summary[split_at:].lstrip()
---
id: download request
event: download_request
question: Download your request for a change
subquestion: |
  [Download your request form (PDF)](${ tc0035_attachment.pdf.url_for(attachment=True) })

  1. Check the form. Sign and date page 2. You can print it and sign by hand. To sign in a PDF editor, type **/s/** and your name in the signature box.
  2. Bring or mail the form to the court hearing the case. Address it to the ADA Assistance Coordinator.
  3. Keep a copy. If your court date is close or you need help, [contact the ADA Assistance Coordinator](https://www.mass.gov/info-details/how-to-ask-the-court-for-a-reasonable-accommodation-under-the-americans-with-disabilities-act).

  You send the form to the court yourself. Leave out medical records.
---
attachment:
  name: Massachusetts Trial Court request for a change
  filename: massachusetts-court-request-for-a-change
  variable name: tc0035_attachment
  valid formats:
    - pdf
  pdf template file: tc0035_request_for_accommodation.pdf
  editable: True
  pdftk: False
  fields:
    - court_department: ${ court_department_names[court_department] }
    - court_division: ${ court_division }
    - docket_number: ${ docket_number }
    - case_name: ${ case_name }
    - person_name: ${ person_name }
    - person_street: ${ person_street }
    - person_city_state_zip: ${ person_city_state_zip }
    - person_phone: ${ person_phone }
    - person_email: ${ person_email }
    - role_party: ${ person_role == "party" }
    - role_legal_staff: ${ person_role == "legal_staff" }
    - role_witness: ${ person_role == "witness" }
    - role_other: ${ person_role == "other" }
    - other_case_role: ${ other_case_role if person_role == "other" else "" }
    - hearing_date_and_time: ${ format_date(hearing_date, format="M/d/yyyy") + (" " + format_time(hearing_time, format="h:mm a") if hearing_time else "") if hearing_is_scheduled else "" }
    - assistive_listening_device: ${ needs_listed_accommodation and accommodations["listening"] }
    - cart: ${ needs_listed_accommodation and accommodations["cart"] }
    - screen_reader_documents: ${ needs_listed_accommodation and accommodations["screen_reader"] }
    - asl_interpreter: ${ needs_listed_accommodation and accommodations["asl"] }
    - other_sign_language_interpreter: ${ needs_listed_accommodation and accommodations["other_sign"] }
    - other_sign_language: ${ other_sign_language if needs_listed_accommodation and accommodations["other_sign"] else "" }
    - powered_mobility_device: ${ needs_listed_accommodation and accommodations["mobility"] }
    - powered_mobility_description_checkbox: ${ needs_listed_accommodation and accommodations["mobility"] }
    - powered_mobility_description: ${ mobility_description if needs_listed_accommodation and accommodations["mobility"] else "" }
    - other_accommodations: ${ other_accommodations if not needs_listed_accommodation or accommodations["another"] else "" }
    - disability_summary: ${ disability_first_page }
    - disability_continuation: ${ disability_second_page }
    - requestor_name: ${ person_name if requesting_for_self else helper_name }
    - requestor_relationship: ${ "Self" if requesting_for_self else helper_relationship }
    - requestor_phone: ${ person_phone if requesting_for_self else helper_phone }
    - requestor_email: ${ person_email if requesting_for_self else helper_email }
    - requestor_address: ${ ", ".join(part for part in (person_street, person_city_state_zip) if part) if requesting_for_self else helper_address }
    - requestor_bbo: ${ request_bbo }
